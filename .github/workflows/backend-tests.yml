name: Backend tests

on:
  pull_request:
  push:
    # main plus team working branches, so a push is checked before a PR exists.
    branches:
      - main
      - "sprint-*"
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the now-outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.11, PostgreSQL 15)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Throwaway database that exists only for this job. Its *_test name
      # satisfies the safety guard in tests/test_request_log.py.
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: truthlayer
          POSTGRES_PASSWORD: truthlayer-ci-only
          POSTGRES_DB: truthlayer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truthlayer -d truthlayer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only credentials for the throwaway service above; not a secret.
      # Setting this makes the PostgreSQL tests run instead of skipping.
      TRUTHLAYER_TEST_DATABASE_URL: postgresql+psycopg://truthlayer:truthlayer-ci-only@localhost:5432/truthlayer_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-calibration.txt

      - name: Install dependencies (without ML model packages)
        # sentence-transformers/transformers pull in PyTorch and model
        # downloads. All tests use fake models except one real-model test,
        # which skips itself when those packages are missing.
        run: |
          grep -vE '^(sentence-transformers|transformers)\b' requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements-ci.txt"
          python -m pip install -r requirements-calibration.txt

      - name: Run tests
        # -ra: end-of-run summary of every failure, error and skip (with reason).
        # pytest exits non-zero on any failure or error, which fails this check.
        run: python -m pytest -ra
